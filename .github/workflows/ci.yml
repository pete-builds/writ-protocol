# Writ v0.1 continuous integration.
#
# Supported toolchains: Go 1.25 (from impl/go/go.mod; the reference
# implementation is developed on 1.26) and Python 3.12 through 3.14 (the
# second implementation is developed on 3.14). Every job fails on any
# divergence: a Go test, a Python test, a vector either implementation
# rejects differently from the other, an executor scenario either
# implementation answers differently, a fuzzed input the two judge
# differently, a corpus that is not byte-for-byte reproducible from the
# generators, a demo expectation that does not hold, or a concurrency
# check against a real executor process that does not hold.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_CRYPTOGRAPHY: "cryptography>=42,<47"
  PYTHON_JSONSCHEMA: "jsonschema>=4.18,<5"

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: gofmt
        working-directory: impl/go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        working-directory: impl/go
        run: go vet ./...
      - name: go test
        working-directory: impl/go
        run: go test -count=1 ./...

  vault:
    name: signing through Vault transit, real server
    runs-on: ubuntu-latest
    services:
      vault:
        image: hashicorp/vault@sha256:47f14a6acb98f48d798a07df7c83f23a6e636e1cf724c5f8ff165cb32667a1e2 # 2.1.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-root
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports: ["8200:8200"]
        options: --cap-add=IPC_LOCK
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: wait for Vault
        run: for i in $(seq 30); do curl -fs http://127.0.0.1:8200/v1/sys/health && exit 0; sleep 1; done; exit 1
      # Without the server these tests skip, and a skip reads like a pass, so
      # the step also requires each one to have run and passed.
      - name: grants and receipts signed through transit verify; tampered ones fail
        working-directory: impl/go
        env:
          WRIT_VAULT_TEST_ADDR: http://127.0.0.1:8200
          WRIT_VAULT_TEST_TOKEN: ci-root
        run: |
          go test -count=1 -v -run 'TestRealVault|TestGateSignsThroughVault' ./keys/vault/ ./cmd/writ-hook/ | tee vault.log
          grep -q -- '--- PASS: TestRealVault' vault.log
          grep -q -- '--- PASS: TestGateSignsThroughVault' vault.log

  # scripts/writ-gate-macos.sh, run for real: a hosted macOS runner has
  # passwordless sudo, so the gate gets its own account and LaunchDaemons as
  # on a laptop. The runner user then plays the AI agent's user: it must be
  # refused the gate's keys and its program, and its tool call must still be
  # receipted through the socket. Each refusal is paired with the same act
  # done as root, which must succeed, so a check that passes because a file
  # is missing fails instead.
  macos-gate:
    name: macOS gate as its own user, real install with sudo
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GATE_HOME: /var/db/writ/home
      RUN_DIR: /var/db/writ/run
      WRIT_HOOK_SOCKET: /var/db/writ/run/gate.sock
      LIBEXEC: /usr/local/libexec/writ
      SCRIPT: scripts/writ-gate-macos.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: build writ-hook and the writ verifier
        working-directory: impl/go
        run: |
          go build -o "$RUNNER_TEMP/writ-hook" ./cmd/writ-hook
          go build -o "$RUNNER_TEMP/writ" ./cmd/writ
      - name: the runner user is not root, so it can stand in for the agent's user
        run: |
          cat >"$RUNNER_TEMP/ci-helpers.sh" <<'EOF'
          refuse() { if "$@" >/dev/null 2>&1; then echo "::error::this should have failed: $*"; exit 1; fi; }
          # gone: no gate account, daemon, process, or program.
          gone() {
            refuse dscl . -read /Users/_writ
            refuse dscl . -read /Groups/_writ
            test -z "$(dscl . -search /Users UniqueID 350)"
            refuse sudo launchctl print system/org.writ.gate
            refuse sudo launchctl print system/org.writ.renew
            test ! -e /Library/LaunchDaemons/org.writ.gate.plist
            test ! -e /Library/LaunchDaemons/org.writ.renew.plist
            refuse pgrep -U 350
            test ! -e "$LIBEXEC/writ-hook"
          }
          sum() { shasum -a 256 "$1" | cut -d' ' -f1; }
          # denied OUT TEXT: the runner's attempt failed, for permission.
          denied() {
            echo "as $(id -un): $1"
            case $1 in *"Permission denied"*) ;; *) echo "::error::refused, but not for permission: $1"; exit 1 ;; esac
          }
          EOF
          . "$RUNNER_TEMP/ci-helpers.sh"
          id
          test "$(id -u)" -ne 0
          refuse dscl . -read /Users/_writ
          test ! -e /var/db/writ
          stat -f '%N %Su:%Sg %Lp' / /usr /usr/local
          if [ -e /usr/local/libexec ]; then echo yes; else echo no; fi >"$RUNNER_TEMP/had-libexec"
          echo "/usr/local/libexec before the job: $(cat "$RUNNER_TEMP/had-libexec")"
      - name: install refuses a missing or wrong SHA-256, and leaves nothing
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          if out=$(sudo /bin/bash "$SCRIPT" install "$RUNNER_TEMP/writ-hook" 2>&1); then
            echo "::error::install ran with no checksum and no --no-checksum"; exit 1
          fi
          echo "no checksum: $out"
          if out=$(sudo /bin/bash "$SCRIPT" install "$RUNNER_TEMP/writ-hook" "$(printf '0%.0s' {1..64})" 2>&1); then
            echo "::error::install accepted a binary with the wrong SHA-256"; exit 1
          fi
          echo "wrong checksum: $out"
          echo "$out" | grep -q 'has SHA-256'
          gone
          test ! -e "$LIBEXEC"
          test ! -e /var/db/writ
          test "$(if [ -e /usr/local/libexec ]; then echo yes; else echo no; fi)" = "$(cat "$RUNNER_TEMP/had-libexec")"
          echo "after both refusals: no _writ, no daemons, no $LIBEXEC, no /var/db/writ"
      - name: install refuses a program folder another user could write
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          bin=$RUNNER_TEMP/writ-hook
          # A folder above owned by the runner user.
          mkdir -p "$RUNNER_TEMP/unsafe"
          if out=$(sudo env WRIT_GATE_LIBEXEC="$RUNNER_TEMP/unsafe/writ" /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::install used a folder under a runner-owned one"; exit 1
          fi
          echo "runner-owned parent: $out"
          echo "$out" | grep -q 'is owned by runner, not root'
          test ! -e "$RUNNER_TEMP/unsafe/writ"
          # A root-owned folder above that its group can write: a new one,
          # so no system folder's mode is changed.
          gw=/usr/local/ci-group-writable
          sudo install -d -o root -g wheel -m 0775 "$gw"
          if out=$(sudo env WRIT_GATE_LIBEXEC="$gw/writ" /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::install used a folder under a group-writable one"; exit 1
          fi
          echo "group-writable parent: $out"
          echo "$out" | grep -q 'has mode 775'
          test ! -e "$gw/writ"
          sudo rmdir "$gw"
          gone
          test ! -e /var/db/writ
          # Settings that would put the program inside the gate's state, or
          # leave a grant with no limit, are refused before anything is made.
          for l in /var/db/writ/bin /usr/local/libexec/../libexec/writ //var/db/writ/bin /VAR/DB/WRIT/bin; do
            if out=$(sudo env WRIT_GATE_LIBEXEC="$l" /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
              echo "::error::install accepted WRIT_GATE_LIBEXEC=$l"; exit 1
            fi
            echo "WRIT_GATE_LIBEXEC=$l: $out"
            echo "$out" | grep -q 'WRIT_GATE_LIBEXEC must not'
          done
          for g in 'grant -name session -uses 0 -ttl 24h' 'grant -name session -ttl 24h' 'grant -name files -uses 10 -ttl 24h' 'grant -name session -uses 0 x -uses 5'; do
            if out=$(sudo env WRIT_GATE_GRANT="$g" /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
              echo "::error::install accepted WRIT_GATE_GRANT=$g"; exit 1
            fi
            echo "WRIT_GATE_GRANT=$g: $out"
            echo "$out" | grep -q 'writ-gate-macos: WRIT_GATE_GRANT'
          done
          # A stray _writ group with no _writ account is not taken over.
          sudo dscl . -create /Groups/_writ
          sudo dscl . -create /Groups/_writ PrimaryGroupID 4242
          if out=$(sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::install took over a stray _writ group"; exit 1
          fi
          echo "stray group: $out"
          echo "$out" | grep -q 'a group _writ exists with no account _writ'
          sudo dscl . -delete /Groups/_writ
          gone
          test ! -e /var/db/writ
      - name: a failed install undoes itself
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          # /usr/bin/false as the program fails at key setup, after the
          # folder, the binary, the account, and the state exist.
          if out=$(sudo /bin/bash "$SCRIPT" install /usr/bin/false "$(sum /usr/bin/false)" 2>&1); then
            echo "::error::install of a program that cannot run succeeded"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'created _writ (350)'
          echo "$out" | grep -q 'undoing what this run created'
          gone
          test ! -e "$LIBEXEC"
          test ! -e /var/db/writ
          test "$(if [ -e /usr/local/libexec ]; then echo yes; else echo no; fi)" = "$(cat "$RUNNER_TEMP/had-libexec")"
          echo "after the failed install: no _writ, no daemons, no $LIBEXEC, no /var/db/writ"
      - name: install, with sudo
        run: sudo /bin/bash "$SCRIPT" install "$RUNNER_TEMP/writ-hook" "$(shasum -a 256 "$RUNNER_TEMP/writ-hook" | cut -d' ' -f1)"
      - name: the gate runs as _writ under launchd, from a root-owned folder
        run: |
          dscl . -read /Users/_writ UniqueID UserShell IsHidden
          sudo launchctl print system/org.writ.gate | grep -E '^[[:space:]]*(state|pid|username) ='
          sudo launchctl print system/org.writ.renew >/dev/null
          ps -axo user=,command= | grep '[w]rit-hook serve'
          test "$(ps -axo user=,command= | awk '/[w]rit-hook serve/ {print $1}')" = _writ
          stat -f '%N %Su:%Sg %Lp' /usr/local/libexec "$LIBEXEC" "$LIBEXEC/writ-hook" "$WRIT_HOOK_SOCKET"
          test "$(stat -f '%Su:%Sg %Lp' "$LIBEXEC")" = "root:wheel 755"
          test "$(stat -f '%Su:%Sg %Lp' "$LIBEXEC/writ-hook")" = "root:wheel 755"
          sudo ls -ld /var/db/writ "$GATE_HOME"
          # The log folder is root's, so the gate cannot plant a link where
          # launchd, as root, opens its logs.
          stat -f '%N %Su:%Sg %Lp' /var/db/writ/log /var/db/writ/log/org.writ.gate.log /var/db/writ/log/org.writ.renew.log
          test "$(stat -f '%Su:%Sg %Lp' /var/db/writ/log)" = "root:wheel 755"
          for l in gate renew; do
            test "$(stat -f '%Su:%Sg %Lp' "/var/db/writ/log/org.writ.$l.log")" = "_writ:_writ 640"
          done
          sudo ls -lde /var/db/writ "$GATE_HOME" /var/db/writ/run /var/db/writ/log
          for d in /var/db/writ "$GATE_HOME" /var/db/writ/run /var/db/writ/log; do
            test -z "$(sudo find "$d" -maxdepth 0 -acl)"
          done
      - name: control, the runner user cannot read the gate's keys, and root can
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          for f in root.seed claude/agent.seed claude/gate.seed; do
            p=$GATE_HOME/$f
            # Negative control: the file exists and root can read it, so the
            # refusal below is a permission, not a missing file.
            n=$(sudo cat "$p" | wc -c | tr -d ' ')
            test "$n" -gt 0
            echo "as root: read $p, $n bytes"
            if out=$(cat "$p" 2>&1); then
              echo "::error::the runner user read $p"; exit 1
            fi
            denied "$out"
            m=$(sudo stat -f '%Lp %Su' "$p")
            echo "as root: stat $p: $m"
            test "$m" = "600 _writ"
          done
          if out=$(ls "$GATE_HOME" 2>&1); then
            echo "::error::the runner user listed $GATE_HOME"; exit 1
          fi
          denied "$out"
          echo "as root: $(sudo ls "$GATE_HOME" | tr '\n' ' ')"
      - name: control, the runner user cannot replace the gate's program, and root can
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          b=$LIBEXEC/writ-hook
          if out=$(mv "$b" "$b.moved" 2>&1); then
            echo "::error::the runner user renamed $b"; exit 1
          fi
          denied "$out"
          if out=$(cp /usr/bin/true "$b" 2>&1); then
            echo "::error::the runner user overwrote $b"; exit 1
          fi
          denied "$out"
          if out=$(cp /usr/bin/true "$LIBEXEC/other" 2>&1); then
            echo "::error::the runner user wrote into $LIBEXEC"; exit 1
          fi
          denied "$out"
          # Negative control: the same rename as root succeeds, so the
          # refusals above are permissions.
          sudo mv "$b" "$b.moved"
          sudo mv "$b.moved" "$b"
          echo "as root: mv $b and back, succeeded"
          cmp "$b" "$RUNNER_TEMP/writ-hook"
      - name: a tool call through the socket is admitted and receipted
        run: |
          pre='{"hook_event_name":"PreToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/etc/hosts"},"tool_use_id":"toolu_ci_1"}'
          post='{"hook_event_name":"PostToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/etc/hosts"},"tool_use_id":"toolu_ci_1","tool_response":"ci-response"}'
          out=$(printf '%s' "$pre" | "$LIBEXEC/writ-hook" pre)
          if [ -n "$out" ]; then echo "::error::pre did not admit the call: $out"; exit 1; fi
          echo "pre toolu_ci_1: admitted (the gate printed no decision)"
          out=$(printf '%s' "$post" | "$LIBEXEC/writ-hook" post)
          if [ -n "$out" ]; then echo "::error::post: $out"; exit 1; fi
          echo "post toolu_ci_1: done"
          # A call naming the gate's own keys is refused by the gate itself.
          bad='{"hook_event_name":"PreToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/var/db/writ/home/root.seed"},"tool_use_id":"toolu_ci_2"}'
          out=$(printf '%s' "$bad" | "$LIBEXEC/writ-hook" pre)
          echo "pre toolu_ci_2: $out"
          echo "$out" | grep -q '"permissionDecision":"deny"'
          "$LIBEXEC/writ-hook" receipts | tee "$RUNNER_TEMP/receipts.txt"
          grep -q '^1 receipt(s) verified, 0 invalid, 0 call(s) still unfinished$' "$RUNNER_TEMP/receipts.txt"
          grep -q '^1 refusal(s) in the audit record$' "$RUNNER_TEMP/receipts.txt"
      - name: the receipt verifies with the writ verifier, outside the gate
        run: |
          # The store is the gate's private state; an auditor copies it out
          # as root, then checks the receipt with nothing but the verifier.
          d=$RUNNER_TEMP/receipt
          mkdir -p "$d"
          sudo sh -c "cat $GATE_HOME/claude/stores/*.json" >"$d/stores.json"
          jq -s '[.[].calls[] | select(.tally != null)]' "$d/stores.json" >"$d/done.json"
          jq -e 'length == 1' "$d/done.json"
          jq '.[0].call' "$d/done.json" >"$d/call.json"
          jq '.[0].call.chain[-1]' "$d/done.json" >"$d/leaf.json"
          jq '.[0].tally' "$d/done.json" >"$d/tally.json"
          # The grant is the gate's grantor's, not some other key's.
          test "$(jq -r '.chain[0].iss' "$d/call.json")" = "$(sudo cat "$GATE_HOME/root.did" | tr -d '\n')"
          # The receipt commits to the response this job sent, by hash.
          sum=$(printf '%s' '"ci-response"' | shasum -a 256 | cut -d' ' -f1)
          printf '{"tool_use_id":"toolu_ci_1","response_sha256":"%s"}' "$sum" >"$d/res.json"
          "$RUNNER_TEMP/writ" verify -writ "$d/leaf.json" -call "$d/call.json" -tally "$d/tally.json" -res "$d/res.json" | tee "$d/verdict.json"
          jq -e '.verdict == "valid" and .st == "ok"' "$d/verdict.json"
          # Negative control: a different response must not verify.
          bad=$(printf '%s' '"other-response"' | shasum -a 256 | cut -d' ' -f1)
          printf '{"tool_use_id":"toolu_ci_1","response_sha256":"%s"}' "$bad" >"$d/res-bad.json"
          if "$RUNNER_TEMP/writ" verify -writ "$d/leaf.json" -call "$d/call.json" -tally "$d/tally.json" -res "$d/res-bad.json"; then
            echo "::error::the verifier accepted a receipt for a response it does not commit to"; exit 1
          fi
      - name: a reinstall over a running gate keeps its state; a changed account is refused
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          bin=$RUNNER_TEMP/writ-hook
          sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")"
          "$LIBEXEC/writ-hook" receipts | tee "$RUNNER_TEMP/receipts-reinstall.txt"
          grep -q '^1 receipt(s) verified, 0 invalid' "$RUNNER_TEMP/receipts-reinstall.txt"
          sudo dscl . -create /Users/_writ UserShell /bin/zsh
          if out=$(sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::install reused an account with a login shell"; exit 1
          fi
          echo "changed account: $out"
          echo "$out" | grep -q 'exists with shell /bin/zsh'
          sudo dscl . -create /Users/_writ UserShell /usr/bin/false
      - name: whatever the gate plants, uninstall archives and deletes its state without touching what the plants point to
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          bin=$RUNNER_TEMP/writ-hook
          hosts=/private/etc/hosts
          sock=/private/var/run/syslog
          meta() { stat -f '%Su:%Sg %Lp links=%l' "$1"; }
          hosts_before=$(meta "$hosts")
          sock_before=$(meta "$sock")
          echo "before: $hosts $hosts_before; $sock $sock_before"
          W() { sudo -u _writ "$@"; }
          # Everything here is done as _writ, and each must succeed, so the
          # checks below test real plants.
          W ln "$hosts" "$GATE_HOME/link-hosts"
          W ln "$sock" "$GATE_HOME/link-syslog"
          W ln -s "$hosts" "$GATE_HOME/symlink-hosts"
          W mkfifo "$GATE_HOME/fifo"
          W touch "$GATE_HOME/locked"
          W chflags uchg "$GATE_HOME/locked"
          W chmod +a "everyone allow add_file,add_subdirectory,delete_child" "$RUN_DIR"
          W mkdir "$RUN_DIR/open"
          W chmod 0777 "$RUN_DIR/open"
          echo "as _writ, planted:"
          sudo ls -lOe "$GATE_HOME"
          sudo ls -lde "$RUN_DIR" "$RUN_DIR/open"
          echo "after the plants: $hosts $(meta "$hosts"); $sock $(meta "$sock")"
          # A reinstall over the live gate refuses a run folder with an ACL.
          if out=$(sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::a reinstall accepted a run folder with an ACL"; exit 1
          fi
          echo "reinstall: $out"
          echo "$out" | grep -q 'carries an ACL'
          ls /var/db/writ-archive-*.tar >"$RUNNER_TEMP/archives-before" 2>/dev/null || true
          sudo /bin/bash "$SCRIPT" uninstall | tee "$RUNNER_TEMP/uninstall.txt"
          echo "after uninstall: $hosts $(meta "$hosts"); $sock $(meta "$sock")"
          test "$(meta "$hosts")" = "$hosts_before"
          test "$(meta "$sock")" = "$sock_before"
          refuse sudo test -e /var/db/writ
          refuse sudo test -L /var/db/writ
          echo "/var/db/writ is gone"
          gone
          echo "no uid 350 process, account, daemon, or program"
          archive=$(sed -n 's/^archived .* to \(.*\.tar\) (root only).*/\1/p' "$RUNNER_TEMP/uninstall.txt")
          test -n "$archive"
          refuse grep -qx "$archive" "$RUNNER_TEMP/archives-before"
          echo "archive: $(stat -f '%N %Su:%Sg %Lp' "$archive")"
          test "$(stat -f '%Su:%Sg %Lp' "$archive")" = "root:wheel 600"
          refuse cat "$archive"
          sudo tar -tvf "$archive" | grep -E 'link-|symlink-|fifo|locked|run/open' || true
          # The audit record read back out of the archive still verifies.
          sudo tar -xOf "$archive" writ/home/claude/audit.jsonl >"$RUNNER_TEMP/archived-audit.jsonl"
          "$RUNNER_TEMP/writ" audit "$RUNNER_TEMP/archived-audit.jsonl"
          # Leftover state with no account is refused, not adopted.
          sudo install -d -o root -g wheel -m 0755 /var/db/writ
          if out=$(sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" 2>&1); then
            echo "::error::install adopted a leftover /var/db/writ"; exit 1
          fi
          echo "leftover state: $out"
          echo "$out" | grep -q 'exists with no _writ account'
          sudo rmdir /var/db/writ
          gone
          # A clean install makes a fresh tree the runner cannot write into.
          sudo /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")" >/dev/null
          ls -lde /var/db/writ "$RUN_DIR" /var/db/writ/log
          for d in /var/db/writ "$RUN_DIR" /var/db/writ/log; do
            test -z "$(find "$d" -maxdepth 0 -acl)"
          done
          if out=$(touch "$RUN_DIR/runner-file" 2>&1); then
            echo "::error::the runner user created a file in $RUN_DIR"; exit 1
          fi
          denied "$out"
          test "$(meta "$hosts")" = "$hosts_before"
          test "$(meta "$sock")" = "$sock_before"
          "$LIBEXEC/writ-hook" receipts | grep '^0 receipt(s) verified, 0 invalid'
      - name: uninstall archives the state and leaves no account, daemon, process, or binary
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          sudo /bin/bash "$SCRIPT" uninstall
          gone
          test ! -e "$LIBEXEC"
          refuse sudo test -e /var/db/writ
          # With the gate gone, a hook fails closed.
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/etc/hosts"},"tool_use_id":"toolu_ci_3"}' | "$RUNNER_TEMP/writ-hook" pre)
          echo "pre after uninstall: $out"
          echo "$out" | grep -q '"permissionDecision":"deny"'
          ls -l /var/db/writ-archive-*.tar
      - name: a fresh install makes new keys under a narrower grant, and uninstall --purge keeps nothing
        run: |
          . "$RUNNER_TEMP/ci-helpers.sh"
          bin=$RUNNER_TEMP/writ-hook
          sudo env WRIT_GATE_GRANT='grant -name session -tools Read -uses 100 -ttl 24h -renew-before 22h' /bin/bash "$SCRIPT" install "$bin" "$(sum "$bin")"
          for f in root.seed claude/agent.seed claude/gate.seed; do
            test "$(sudo stat -f '%Lp %Su' "$GATE_HOME/$f")" = "600 _writ"
          done
          read_in='{"hook_event_name":"PreToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/etc/hosts"},"tool_use_id":"toolu_ci_4"}'
          out=$(printf '%s' "$read_in" | "$LIBEXEC/writ-hook" pre)
          if [ -n "$out" ]; then echo "::error::the narrower grant refused a Read: $out"; exit 1; fi
          printf '%s' '{"hook_event_name":"PostToolUse","session_id":"ci","tool_name":"Read","tool_input":{"file_path":"/etc/hosts"},"tool_use_id":"toolu_ci_4","tool_response":"ci-response"}' | "$LIBEXEC/writ-hook" post
          echo "pre toolu_ci_4 (Read): admitted"
          out=$(printf '%s' '{"hook_event_name":"PreToolUse","session_id":"ci","tool_name":"Bash","tool_input":{"command":"true"},"tool_use_id":"toolu_ci_5"}' | "$LIBEXEC/writ-hook" pre)
          echo "pre toolu_ci_5 (Bash): $out"
          echo "$out" | grep -q '"permissionDecision":"deny"'
          echo "$out" | grep -q 'allows only Read'
          "$LIBEXEC/writ-hook" receipts | tee "$RUNNER_TEMP/receipts-fresh.txt"
          grep -q '^1 receipt(s) verified, 0 invalid' "$RUNNER_TEMP/receipts-fresh.txt"
          n=$(find /var/db -maxdepth 1 -name 'writ-archive-*.tar' | wc -l)
          sudo /bin/bash "$SCRIPT" uninstall --purge
          gone
          refuse sudo test -e /var/db/writ
          test "$(find /var/db -maxdepth 1 -name 'writ-archive-*.tar' | wc -l)" -eq "$n"
          echo "uninstall --purge: no new archive, no /var/db/writ"
      - name: gate logs, on failure
        if: failure()
        run: |
          sudo sh -c 'cat /var/db/writ/log/*.log' || true
          sudo launchctl print system/org.writ.gate || true
          sudo launchctl print system/org.writ.renew || true

  python:
    name: python ${{ matrix.python }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: unittest
        working-directory: impl/python
        run: python -m unittest discover -s tests -v

  conformance:
    name: cross-implementation conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: Go verifier on the Go corpus
        working-directory: impl/go
        run: go run ./cmd/writ conformance ../../conformance/vectors
      - name: Go verifier on every Python-generated vector
        working-directory: impl/go
        run: go run ./cmd/writ conformance ../python/vectors
      - name: Python verifier on every Go-generated vector
        working-directory: impl/python
        run: python -m writ.cli conformance ../../conformance/vectors
      - name: Python verifier on the Python vectors
        working-directory: impl/python
        run: python -m writ.cli conformance vectors
      - name: Go executor on the scenarios
        working-directory: impl/go
        run: go run ./cmd/writ scenarios ../../conformance/scenarios
      - name: Python executor on the scenarios
        working-directory: impl/python
        run: python -m writ.cli scenarios ../../conformance/scenarios

  fuzz:
    name: differential fuzz, fixed seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      # The Go verifier judges 20,000 mutated inputs and writes each as a
      # vector; the Python verifier must reach the same verdict and reason on
      # every one. A fixed seed makes a failure here reproducible locally.
      - name: generate and judge with Go
        working-directory: impl/go
        run: go run ./cmd/writ-fuzz -seed 1 -n 20000 -out "$RUNNER_TEMP/fuzz"
      - name: Python must agree on every input
        working-directory: impl/python
        run: |
          if ! python -m writ.cli conformance "$RUNNER_TEMP/fuzz" > "$RUNNER_TEMP/fuzz.log"; then
            grep '^FAIL' "$RUNNER_TEMP/fuzz.log" | head -100
            tail -1 "$RUNNER_TEMP/fuzz.log"
            exit 1
          fi
          tail -1 "$RUNNER_TEMP/fuzz.log"

  native-fuzz:
    name: native Go fuzz targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      # testing.F targets for canonicalization, object decoding, and the
      # tally checker, seeded from the conformance corpus. Go fuzzes one
      # target per run; a failing input is written under testdata/fuzz.
      - name: jcs canonicalization
        working-directory: impl/go
        run: go test -run '^$' -fuzz '^FuzzCanonicalize$' -fuzztime 30s ./jcs
      - name: wire decoding
        working-directory: impl/go
        run: go test -run '^$' -fuzz '^FuzzDecode$' -fuzztime 30s ./wire
      - name: tally checker
        working-directory: impl/go
        run: go test -run '^$' -fuzz '^FuzzVerifyTally$' -fuzztime 30s ./writ

  schemas:
    name: vector and scenario schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_JSONSCHEMA"
      # Every vector and scenario against conformance/schema, the schema's
      # reasons against spec section 11, and broken copies that must fail.
      - name: check schemas, with controls
        run: python scripts/check-schemas.py --control

  vectors:
    name: deterministic vector regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: regenerate the Go corpus
        working-directory: impl/go
        run: go run ./cmd/writ-vectors
      - name: regenerate the Python vectors
        working-directory: impl/python
        run: python tools/gen_vectors.py
      - name: regenerate the scenarios
        working-directory: impl/go
        run: go run ./cmd/writ-scenarios
      - name: every vector and scenario must be reproducible byte for byte
        run: |
          git add -A conformance/vectors conformance/scenarios impl/python/vectors
          git diff --cached --stat --exit-code conformance/vectors conformance/scenarios impl/python/vectors
      - name: the Internet-Draft must match the spec it is generated from
        run: |
          python3 scripts/build-ietf-draft.py
          git diff --stat --exit-code docs/ietf/draft-stergion-writ-00.md

  concurrency:
    name: concurrency proof, real executor process
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      # writ-agent runs as its own process, built with the race detector,
      # behind real HTTP; README.md publishes the same run at full size.
      - name: claims, totals, replays, and a restart under 128 requests in flight
        working-directory: impl/go
        run: go run ./cmd/writ-bench -claims 2000 -totals 2000 -fits 50 -replays 10000 -workers 128 -race

  demo:
    name: three-process demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: run the demo
        run: sh demo/run.sh
      - name: every expectation held
        run: grep -q "DEMO PASSED" demo/out/demo.log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: run the demo with the Python executor as C
        run: WRIT_C=python sh demo/run.sh
      - name: every expectation held across implementations
        run: grep -q "DEMO PASSED" demo/out/demo.log && grep -q "(Python)" demo/out/C.log
