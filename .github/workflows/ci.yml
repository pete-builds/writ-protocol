# Writ v0.1 continuous integration.
#
# Supported toolchains: Go 1.25 (from impl/go/go.mod; the reference
# implementation is developed on 1.26) and Python 3.12 through 3.14 (the
# second implementation is developed on 3.14). Every job fails on any
# divergence: a Go test, a Python test, a vector either implementation
# rejects differently from the other, an executor scenario either
# implementation answers differently, a fuzzed input the two judge
# differently, a corpus that is not byte-for-byte reproducible from the
# generators, or a demo expectation that does not hold.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_CRYPTOGRAPHY: "cryptography>=42,<47"

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: gofmt
        working-directory: impl/go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        working-directory: impl/go
        run: go vet ./...
      - name: go test
        working-directory: impl/go
        run: go test -count=1 ./...

  python:
    name: python ${{ matrix.python }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: unittest
        working-directory: impl/python
        run: python -m unittest discover -s tests -v

  conformance:
    name: cross-implementation conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: Go verifier on the Go corpus
        working-directory: impl/go
        run: go run ./cmd/writ conformance ../../conformance/vectors
      - name: Go verifier on every Python-generated vector
        working-directory: impl/go
        run: go run ./cmd/writ conformance ../python/vectors
      - name: Python verifier on every Go-generated vector
        working-directory: impl/python
        run: python -m writ.cli conformance ../../conformance/vectors
      - name: Python verifier on the Python vectors
        working-directory: impl/python
        run: python -m writ.cli conformance vectors
      - name: Go executor on the scenarios
        working-directory: impl/go
        run: go run ./cmd/writ scenarios ../../conformance/scenarios
      - name: Python executor on the scenarios
        working-directory: impl/python
        run: python -m writ.cli scenarios ../../conformance/scenarios

  fuzz:
    name: differential fuzz, fixed seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      # The Go verifier judges 20,000 mutated inputs and writes each as a
      # vector; the Python verifier must reach the same verdict and reason on
      # every one. A fixed seed makes a failure here reproducible locally.
      - name: generate and judge with Go
        working-directory: impl/go
        run: go run ./cmd/writ-fuzz -seed 1 -n 20000 -out "$RUNNER_TEMP/fuzz"
      - name: Python must agree on every input
        working-directory: impl/python
        run: |
          if ! python -m writ.cli conformance "$RUNNER_TEMP/fuzz" > "$RUNNER_TEMP/fuzz.log"; then
            grep '^FAIL' "$RUNNER_TEMP/fuzz.log" | head -100
            tail -1 "$RUNNER_TEMP/fuzz.log"
            exit 1
          fi
          tail -1 "$RUNNER_TEMP/fuzz.log"

  vectors:
    name: deterministic vector regeneration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: regenerate the Go corpus
        working-directory: impl/go
        run: go run ./cmd/writ-vectors
      - name: regenerate the Python vectors
        working-directory: impl/python
        run: python tools/gen_vectors.py
      - name: regenerate the scenarios
        working-directory: impl/go
        run: go run ./cmd/writ-scenarios
      - name: every vector and scenario must be reproducible byte for byte
        run: |
          git add -A conformance/vectors conformance/scenarios impl/python/vectors
          git diff --cached --stat --exit-code conformance/vectors conformance/scenarios impl/python/vectors
      - name: the Internet-Draft must match the spec it is generated from
        run: |
          python3 scripts/build-ietf-draft.py
          git diff --stat --exit-code docs/ietf/draft-stergion-writ-00.md

  demo:
    name: three-process demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: run the demo
        run: sh demo/run.sh
      - name: every expectation held
        run: grep -q "DEMO PASSED" demo/out/demo.log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: run the demo with the Python executor as C
        run: WRIT_C=python sh demo/run.sh
      - name: every expectation held across implementations
        run: grep -q "DEMO PASSED" demo/out/demo.log && grep -q "(Python)" demo/out/C.log
