# Writ releases. Pushing a tag v* runs the Go tests, builds the command-line
# programs for Linux and macOS on amd64 and arm64, and publishes them with
# SHA-256 checksums and SLSA build provenance as a GitHub release, so trying
# Writ does not need a Go toolchain. Windows is not built: writ-hook
# serializes its hook processes with flock. A tag with a hyphen (v0.2.0-rc1)
# is marked a pre-release.
#
# Provenance comes from the SLSA generic generator, which signs, with a
# short-lived Sigstore certificate, which workflow at which commit produced
# archives with exactly these SHA-256 digests. It is published beside the
# archives as writ-<tag>.intoto.jsonl, and checked with slsa-verifier:
#
#   slsa-verifier verify-artifact writ-<tag>-linux-amd64.tar.gz \
#     --provenance-path writ-<tag>.intoto.jsonl \
#     --source-uri github.com/pete-builds/writ-protocol --source-tag <tag>
#
# The generator is referenced by its full version tag, not a commit SHA:
# slsa-verifier checks the ref of the reusable workflow that signed, and the
# generator's own README says it MUST be referenced as @vX.Y.Z.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: test before building anything
        working-directory: impl/go
        run: go test -count=1 ./...
      - name: build
        run: sh scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: digests for provenance
        id: hash
        working-directory: dist
        run: echo "hashes=$(sha256sum -- *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  provenance:
    needs: [build]
    permissions:
      actions: read # to read the workflow run the provenance describes
      id-token: write # to sign with a Sigstore certificate for this workflow
      contents: write # the generator's declared permission; this job uploads no assets itself
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      provenance-name: writ-${{ github.ref_name }}.intoto.jsonl

  publish:
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $pre \
            --title "Writ $GITHUB_REF_NAME" \
            --notes "Binaries for Linux and macOS, amd64 and arm64: writ (the CLI), writ-agent and writ-demo (the three-agent demo), writ-hook (Claude Code), writ-mcp and writ-mcp-proxy (MCP server and client side), writ-gate (reverse proxy). Check a download against SHA256SUMS, and its build provenance with slsa-verifier and writ-$GITHUB_REF_NAME.intoto.jsonl (see .github/workflows/release.yml). The spec is docs/spec/writ-v0.1.md; README.md has three ways in."
