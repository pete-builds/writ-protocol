# Weekly differential fuzz on a fresh seed. The per-push job in ci.yml
# always replays seed 1, which can only catch a regression on inputs it has
# already seen; this one explores new inputs. The seed is printed first, so
# a failure reproduces locally with the same two commands.
name: fuzz-weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_CRYPTOGRAPHY: "cryptography>=42,<47"

jobs:
  fuzz:
    name: differential fuzz, random seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install "$PYTHON_CRYPTOGRAPHY"
      - name: pick the seed
        run: |
          seed=$(( ${{ github.run_id }} % 1000000000 + 1000 ))
          echo "SEED=$seed" >> "$GITHUB_ENV"
          echo "seed $seed; reproduce with: go run ./cmd/writ-fuzz -seed $seed -n 50000 -out DIR, then python -m writ.cli conformance DIR"
      - name: generate and judge with Go
        working-directory: impl/go
        run: go run ./cmd/writ-fuzz -seed "$SEED" -n 50000 -out "$RUNNER_TEMP/fuzz"
      - name: Python must agree on every input
        working-directory: impl/python
        run: |
          if ! python -m writ.cli conformance "$RUNNER_TEMP/fuzz" > "$RUNNER_TEMP/fuzz.log"; then
            echo "seed $SEED"
            grep '^FAIL' "$RUNNER_TEMP/fuzz.log" | head -100
            tail -1 "$RUNNER_TEMP/fuzz.log"
            exit 1
          fi
          echo "seed $SEED"
          tail -1 "$RUNNER_TEMP/fuzz.log"

  native-fuzz:
    name: native Go fuzz targets, ten minutes each
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - {name: FuzzCanonicalize, pkg: ./jcs}
          - {name: FuzzDecode, pkg: ./wire}
          - {name: FuzzVerifyTally, pkg: ./writ}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: impl/go/go.mod
          cache: false # zero dependencies, so there is no go.sum to key a cache on
      - name: fuzz ${{ matrix.target.name }}
        working-directory: impl/go
        run: go test -run '^$' -fuzz "^${{ matrix.target.name }}\$" -fuzztime 10m ${{ matrix.target.pkg }}
      - name: keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target.name }}
          path: impl/go/**/testdata/fuzz/
